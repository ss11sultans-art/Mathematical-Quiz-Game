<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f0">
    <title>Number Club | Math Quiz</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172b2b;
            --muted: #637575;
            --paper: #fbfcf8;
            --canvas: #edf3ee;
            --line: #d8e2dc;
            --teal: #126b61;
            --teal-dark: #0d514b;
            --coral: #e8755e;
            --mint: #dff2e8;
            --wrong: #fae7e1;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px;
            display: grid;
            place-items: center;
            color: var(--ink);
            background-color: var(--canvas);
            background-image: radial-gradient(#c8d8cf 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        }

        button, input, select { font: inherit; }
        button { color: inherit; }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 3px solid #ee987f;
            outline-offset: 3px;
        }

        .app-shell {
            width: min(100%, 490px);
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--paper);
            box-shadow: 0 22px 60px rgb(29 61 52 / 12%);
            animation: arrive 420ms ease-out both;
        }

        .topbar {
            min-height: 58px;
            padding: 0 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 800;
        }

        .brand-mark {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: white;
            background: var(--teal);
            font-family: Georgia, serif;
            font-size: 15px;
        }

        .edition {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .screen { padding: 32px 34px 34px; }
        .hidden { display: none !important; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--teal);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        h1, h2, p { margin-top: 0; }
        h1, h2 {
            margin-bottom: 9px;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 500;
            letter-spacing: 0;
        }

        h1 { font-size: 36px; line-height: 1.08; }
        h2 { font-size: 29px; line-height: 1.15; }
        .intro { margin-bottom: 26px; color: var(--muted); font-size: 14px; line-height: 1.55; }

        .field { margin: 0 0 17px; }
        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: 800;
        }

        .field input, .field select {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: white;
        }

        .field input::placeholder { color: #879591; }

        .primary-button {
            width: 100%;
            min-height: 48px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: var(--teal);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease;
        }

        .primary-button:hover { background: var(--teal-dark); }
        .primary-button:active { transform: translateY(1px); }
        .form-error { min-height: 18px; margin: 8px 0 0; color: #a64132; font-size: 12px; }

        .quiz-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 23px;
        }

        .player-name { max-width: 65%; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
        .score-pill {
            padding: 7px 10px;
            border-radius: 99px;
            color: var(--teal-dark);
            background: var(--mint);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .progress-meta { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
        .progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #e7ece8; }
        .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--coral); transition: width 220ms ease; }

        .question-block { padding: 27px 0 24px; text-align: center; }
        .question-label { margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
        .question { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 10vw, 52px); font-weight: 500; }
        .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

        .option-button {
            min-height: 52px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: white;
            font-size: 17px;
            font-weight: 750;
            cursor: pointer;
            transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
        }

        .option-button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--teal); background: #f0f8f3; }
        .option-button:disabled { cursor: default; }
        .option-button.correct { border-color: #80bea1; background: var(--mint); }
        .option-button.incorrect { border-color: #e7a18f; background: var(--wrong); }
        .answer-feedback { min-height: 22px; margin: 14px 0 10px; font-size: 13px; font-weight: 750; }
        .answer-feedback[data-state="correct"] { color: var(--teal-dark); }
        .answer-feedback[data-state="incorrect"] { color: #a64132; }
        .next-button { margin-top: 4px; }

        .result-score {
            margin: 23px 0 8px;
            color: var(--teal);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 54px;
            line-height: 1;
        }

        .result-copy { margin-bottom: 27px; color: var(--muted); font-size: 14px; line-height: 1.55; }
        .result-rule { height: 1px; margin: 23px 0; border: 0; background: var(--line); }
        .secondary-button { margin-top: 10px; border: 1px solid var(--line); color: var(--teal-dark); background: transparent; }
        .secondary-button:hover { background: #f0f5f1; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .screen { padding: 27px 22px 25px; }
            .topbar { padding: 0 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="app-shell" aria-label="Number Club math quiz">
        <header class="topbar">
            <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> NUMBER CLUB</div>
            <span class="edition">Quick quiz · No. 01</span>
        </header>

        <section id="landing-screen" class="screen" aria-labelledby="welcome-title">
            <p class="eyebrow">A little mental workout</p>
            <h1 id="welcome-title">Numbers look good on you.</h1>
            <p class="intro">Five questions. Three operations. One very satisfying score.</p>
            <form id="start-form" novalidate>
                <div class="field">
                    <label for="username">Your name</label>
                    <input id="username" name="username" type="text" placeholder="e.g. Alex" autocomplete="given-name" maxlength="40" required>
                </div>
                <div class="field">
                    <label for="difficulty">Choose your pace</label>
                    <select id="difficulty" name="difficulty">
                        <option value="easy">Easy · numbers up to 10</option>
                        <option value="medium">Medium · numbers up to 50</option>
                        <option value="hard">Hard · numbers up to 100</option>
                    </select>
                </div>
                <button class="primary-button" type="submit">Start the quiz <span aria-hidden="true">→</span></button>
                <p id="form-error" class="form-error" role="alert"></p>
            </form>
        </section>

        <section id="quiz-screen" class="screen hidden" aria-labelledby="question-text" aria-live="polite">
            <div class="quiz-heading">
                <span id="player-greeting" class="player-name"></span>
                <span id="score-pill" class="score-pill">0 correct</span>
            </div>
            <div class="progress-meta">
                <span id="question-count">Question 1 of 5</span>
                <span id="difficulty-label">Easy</span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="question-block">
                <p class="question-label">Solve this one</p>
                <h2 id="question-text" class="question"></h2>
            </div>
            <div id="options-container" class="options" aria-label="Answer choices"></div>
            <p id="answer-feedback" class="answer-feedback" aria-live="polite"></p>
            <button id="next-button" class="primary-button next-button hidden" type="button">Next question <span aria-hidden="true">→</span></button>
        </section>

        <section id="results-screen" class="screen hidden" aria-labelledby="results-title" aria-live="polite">
            <p class="eyebrow">That's a wrap</p>
            <h2 id="results-title">Quiz completed.</h2>
            <p id="result-score" class="result-score"></p>
            <p id="final-score" class="result-copy"></p>
            <hr class="result-rule">
            <button id="play-again-button" class="primary-button" type="button">Play again <span aria-hidden="true">↻</span></button>
            <button id="change-settings-button" class="primary-button secondary-button" type="button">Change player or difficulty</button>
        </section>
    </main>

    <script>
        const totalQuestions = 5;
        const screens = {
            landing: document.getElementById("landing-screen"),
            quiz: document.getElementById("quiz-screen"),
            results: document.getElementById("results-screen")
        };
        const form = document.getElementById("start-form");
        const nameInput = document.getElementById("username");
        const difficultyInput = document.getElementById("difficulty");
        const optionsContainer = document.getElementById("options-container");
        const nextButton = document.getElementById("next-button");
        const feedback = document.getElementById("answer-feedback");
        const progress = document.querySelector("[role='progressbar']");
        const maximumByDifficulty = { easy: 10, medium: 50, hard: 100 };
        const difficultyNames = { easy: "Easy", medium: "Medium", hard: "Hard" };

        let playerName = "";
        let difficulty = "easy";
        let score = 0;
        let currentQuestion = 0;
        let correctAnswer = 0;
        let answered = false;

        function showScreen(name) {
            Object.entries(screens).forEach(([screenName, element]) => {
                element.classList.toggle("hidden", screenName !== name);
            });
        }

        function startGame() {
            playerName = nameInput.value.trim();
            difficulty = difficultyInput.value;
            score = 0;
            currentQuestion = 0;
            document.getElementById("player-greeting").textContent = `Playing as ${playerName}`;
            document.getElementById("difficulty-label").textContent = difficultyNames[difficulty];
            document.getElementById("score-pill").textContent = "0 correct";
            showScreen("quiz");
            nextQuestion();
        }

        function makeOptions(answer) {
            const options = new Set([answer]);
            const offset = Math.max(5, Math.ceil(Math.abs(answer) * 0.15));
            while (options.size < 4) {
                const variation = Math.floor(Math.random() * (offset * 2 + 1)) - offset;
                const wrongAnswer = answer + (variation === 0 ? offset + 1 : variation);
                options.add(wrongAnswer);
            }
            return [...options].sort(() => Math.random() - 0.5);
        }

        function nextQuestion() {
            if (currentQuestion === totalQuestions) {
                showResults();
                return;
            }

            currentQuestion += 1;
            answered = false;
            nextButton.classList.add("hidden");
            feedback.textContent = "";
            feedback.removeAttribute("data-state");
            document.getElementById("question-count").textContent = `Question ${currentQuestion} of ${totalQuestions}`;
            progress.setAttribute("aria-valuenow", String(currentQuestion - 1));
            document.getElementById("progress-fill").style.width = `${((currentQuestion - 1) / totalQuestions) * 100}%`;

            const maximum = maximumByDifficulty[difficulty];
            const number1 = Math.floor(Math.random() * maximum) + 1;
            const number2 = Math.floor(Math.random() * maximum) + 1;
            const operator = ["+", "-", "×"][Math.floor(Math.random() * 3)];
            correctAnswer = operator === "+" ? number1 + number2
                : operator === "-" ? number1 - number2
                : number1 * number2;

            document.getElementById("question-text").textContent = `${number1} ${operator} ${number2} = ?`;
            optionsContainer.replaceChildren();
            makeOptions(correctAnswer).forEach((option) => {
                const button = document.createElement("button");
                button.className = "option-button";
                button.type = "button";
                button.textContent = option;
                button.addEventListener("click", () => checkAnswer(option, button));
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selected, selectedButton) {
            if (answered) return;
            answered = true;
            const isCorrect = selected === correctAnswer;
            if (isCorrect) {
                score += 1;
                selectedButton.classList.add("correct");
                feedback.textContent = "Exactly right.";
                feedback.dataset.state = "correct";
            } else {
                selectedButton.classList.add("incorrect");
                feedback.textContent = `Not quite. The answer is ${correctAnswer}.`;
                feedback.dataset.state = "incorrect";
                optionsContainer.querySelectorAll(".option-button").forEach((button) => {
                    if (Number(button.textContent) === correctAnswer) button.classList.add("correct");
                });
            }
            optionsContainer.querySelectorAll(".option-button").forEach((button) => { button.disabled = true; });
            document.getElementById("score-pill").textContent = `${score} correct`;
            progress.setAttribute("aria-valuenow", String(currentQuestion));
            document.getElementById("progress-fill").style.width = `${(currentQuestion / totalQuestions) * 100}%`;
            nextButton.textContent = currentQuestion === totalQuestions ? "See your score" : "Next question →";
            nextButton.classList.remove("hidden");
            nextButton.focus();
        }

        function showResults() {
            showScreen("results");
            document.getElementById("result-score").textContent = `${score}/${totalQuestions}`;
            const message = score === totalQuestions ? "A perfect round. Beautifully done."
                : score >= 3 ? "A strong round. Your number sense is showing."
                : "Every round is practice. Ready for another?";
            document.getElementById("final-score").textContent = `${playerName}, ${message}`;
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!nameInput.value.trim()) {
                document.getElementById("form-error").textContent = "Add your name before starting.";
                nameInput.focus();
                return;
            }
            document.getElementById("form-error").textContent = "";
            startGame();
        });

        nameInput.addEventListener("input", () => {
            document.getElementById("form-error").textContent = "";
        });
        nextButton.addEventListener("click", nextQuestion);
        document.getElementById("play-again-button").addEventListener("click", startGame);
        document.getElementById("change-settings-button").addEventListener("click", () => {
            showScreen("landing");
            nameInput.focus();
        });
    </script>
</body>
</html>
